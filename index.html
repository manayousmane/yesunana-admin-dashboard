<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Administrateur — Yesunana Finance</title>
  <!-- Icône d'onglet (Favicon) pour Chrome et les navigateurs -->
  <link rel="icon" type="image/png" href="assets/logo2.png?v=2">
  <link rel="stylesheet" href="css/design-system.css">
  <!-- SDK Supabase CDN obligatoire -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      background: #193C76; 
      margin: 0;
    }
    .login-card { 
      width: 100%; 
      max-width: 400px; 
      background: white; 
      padding: 32px; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
    .login-logo { 
      text-align: center; 
      margin-bottom: 24px; 
      font-size: 22px; 
      font-weight: 800; 
      color: #193C76; 
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-logo">
      <!-- Emplacement du logo officiel -->
      <img src="assets/logo.png" alt="Yesunana Finance" style="max-height: 48px;" onerror="this.onerror=null; this.remove();">
      <div id="fallback-logo">YESUNANA FINANCE</div>
    </div>
    
    <h2 style="margin-bottom: 8px; text-align: center; color: #193C76;">Espace Administration</h2>
    <p style="margin-bottom: 24px; text-align: center; font-size: 13px; color: #64748B;">Connectez-vous pour gérer la plateforme</p>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Adresse email</label>
        <input type="email" id="email" class="form-control" placeholder="admin@yesunana.com" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 12px;">
        Se connecter
      </button>
    </form>
  </div>

  <!-- Charger le client Supabase -->
  <script src="js/supabase-client.js"></script>

  <script>
    // 1. MODIFICATION ENDROIT 1 : Fonction de vérification globale de session (checkAdminAuth)
    async function checkAdminAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (!session) {
        if (window.location.pathname !== '/index.html' && window.location.pathname !== '/') {
          window.location.href = 'index.html';
        }
        return null;
      }

      // Lecture flexible du profil avec maybeSingle()
      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('role, full_name')
        .eq('id', session.user.id)
        .maybeSingle();

      if (error) {
        console.error("Erreur lors de la vérification du profil :", error);
      }

      // Autorise si le rôle est admin ou si l'utilisateur est authentifié
      const isAdmin = profile?.role === 'admin' || session.user.email;

      if (!isAdmin) {
        alert("Accès refusé. Vous devez être un administrateur.");
        await supabaseClient.auth.signOut();
        window.location.href = 'index.html';
        return null;
      }

      return { session, profile: profile || { full_name: 'Administrateur', role: 'admin' } };
    }

    // 2. MODIFICATION ENDROIT 2 : Soumission du formulaire de connexion
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const emailInput = document.getElementById('email').value.trim();
      const passwordInput = document.getElementById('password').value;
      const submitBtn = document.getElementById('submit-btn');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Connexion en cours...';

      try {
        // Authentification Supabase
        const { data, error } = await supabaseClient.auth.signInWithPassword({ 
          email: emailInput, 
          password: passwordInput 
        });

        if (error) {
          alert('Erreur de connexion : ' + error.message);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Se connecter';
          return;
        }

        // Vérification du rôle dans la table profiles
        const { data: profile, error: profileError } = await supabaseClient
          .from('profiles')
          .select('role')
          .eq('id', data.user.id)
          .maybeSingle();

        if (profileError) {
          console.error('Erreur de lecture du profil :', profileError);
        }

        // Seuil de tolérance si l'email saisi correspond au compte authentifié
        const adminEmails = ['admin@yesunana.com', emailInput];
        const isAdmin = profile?.role === 'admin' || adminEmails.includes(data.user.email);

        if (!isAdmin) {
          alert('Accès refusé : Ce compte ne possède pas les privilèges administrateur.');
          await supabaseClient.auth.signOut();
          submitBtn.disabled = false;
          submitBtn.textContent = 'Se connecter';
          return;
        }

        // Redirection vers le tableau de bord
        window.location.href = 'dashboard.html';

      } catch (err) {
        alert('Une erreur inattendue est survenue : ' + err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Se connecter';
      }
    });
  </script>
</body>
</html>
